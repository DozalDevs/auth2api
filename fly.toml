# fly.toml app configuration file generated for dozaldevs-codex-relay on 2026-09-18T13:50:11-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dozaldevs-codex-relay'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'auth2api_data'
  destination = '/data'

[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
