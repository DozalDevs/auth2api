name: setup-scripts

on:
  push:
    paths:
      - "setup/**"
      - "src/setup/**"
      - "tests/setup-scripts.test.ts"
      - "tests/e2e-opencode.test.ts"
      - "tests/helpers/**"
      - ".github/workflows/setup-scripts.yml"
  pull_request:
    paths:
      - "setup/**"
      - "src/setup/**"
      - "tests/setup-scripts.test.ts"
      - "tests/e2e-opencode.test.ts"
      - "tests/helpers/**"
      - ".github/workflows/setup-scripts.yml"

jobs:
  scripts:
    name: scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx --test tests/setup-scripts.test.ts

  opencode:
    name: real OpenCode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g opencode-ai
      - run: opencode --version
      - run: npx tsx --test tests/e2e-opencode.test.ts
        env:
          E2E_OPENCODE: "1"
